[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage_poc"]

[project]
name = "medical-triage-poc"
version = "0.1.0"
description = "Educational medical-triage assistance proof of concept. Not a medical device."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "jsonschema>=4.23,<5",
  "ijson>=3.4,<4",
  "tldextract>=5.3,<6",
  "httpx>=0.28,<1",
  "torch>=2.6,<3",
  "transformers>=4.50,<5",
  "presidio-analyzer>=2.2.360,<3",
  "presidio-anonymizer>=2.2.360,<3",
  "spacy>=3.8,<4",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]

[project.urls]
Repository = "https://github.com/ppluton/medical-triage-llm-poc"
Documentation = "https://github.com/ppluton/medical-triage-llm-poc/tree/main/docs"
Issues = "https://github.com/ppluton/medical-triage-llm-poc/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
