[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage_poc"]

[project]
name = "medical-triage-poc"
version = "0.1.0"
description = "Educational medical-triage assistance proof of concept. Not a medical device."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "jsonschema>=4.23,<5",
  "torch>=2.6,<3",
  "transformers>=4.50,<5",
  "presidio-analyzer>=2.2.360,<3",
  "presidio-anonymizer>=2.2.360,<3",
  "spacy>=3.8,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
