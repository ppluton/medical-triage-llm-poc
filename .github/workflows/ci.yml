name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
      - run: python -m ruff check src scripts tests
      - run: python -c "import json; from pathlib import Path; [json.loads(path.read_text()) for path in Path('data/manifests').glob('*.json')]"
