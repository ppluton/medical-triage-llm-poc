name: Deploy Cloudflare Pages demonstration

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Confirm publication of the educational demonstration frontend"
        required: true
        type: boolean
        default: false

concurrency:
  group: cloudflare-pages-demonstration
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm_deploy }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-demo
    permissions:
      contents: read
    defaults:
      run:
        working-directory: deploy/cloudflare_pages
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: deploy/cloudflare_pages/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install the pinned Cloudflare toolchain
        run: npm ci
      - name: Audit deployment dependencies
        run: npm audit --audit-level=high
      - name: Build static assets and Pages Function
        run: npm run build:upload
      - name: Deploy the confirmed Pages revision
        run: >-
          npx wrangler pages deploy dist
          --project-name=chsa-triage-poc
          --branch=main
